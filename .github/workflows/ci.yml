# CI -- Lint, Type Check, Test, Build + E2E Smoke
# Status badge: ![CI](https://github.com/masonwells1/CRX_Manager_V1.0/actions/workflows/ci.yml/badge.svg)

name: CI -- Lint, Type Check, Test, Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, edited]

# Supersede stale runs only for the same pull request. Every listed PR event,
# including edits, executes both required jobs; only an exact trusted-base
# classification may shorten their expensive steps. Pushes to main receive a
# run-id group and are never cancelled.
concurrency:
  # Metadata edits must not cancel an in-flight code-proof run. Base edits are
  # still classified fail-closed below and receive complete proof.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}-${{ github.event.action == 'edited' && 'edited' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# CI only reads repository content and artifacts. It never needs a writable
# GitHub token, and checkout must not retain one in the local Git config.
permissions:
  contents: read

jobs:
  phase3-private-artifact-containment:
    name: Phase 3C Candidate Containment (CI)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # This is intentionally the first content-processing job. It uses only
    # runner-bundled Node and Git: no candidate .nvmrc, package metadata, or
    # dependencies are processed before containment.
    steps:
      - name: Checkout exact event history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Reject PR packet blobs with the exact trusted base checker
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          phase3_checker_rel='scripts/check-supplier-pricing-phase3-private-artifacts.mjs'
          # Only this introducing PR may bootstrap from trusted main history
          # that descends from this floor without already containing the
          # checker. Once merged, every later PR uses the base revision's
          # checker instead of this candidate fallback.
          phase3_bootstrap_ancestor='d787b7e0e1c9cb5eb85c86b448e68b1ca43fce9c'
          node --version
          mapfile -t phase3_event_shas < <(node --input-type=commonjs -e '
            const fs = require("node:fs");
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            const sha = value => typeof value === "string" && /^[0-9a-f]{40}$/i.test(value) ? value.toLowerCase() : null;
            const base = sha(event?.pull_request?.base?.sha);
            const head = sha(event?.pull_request?.head?.sha);
            if (!base || !head) process.exit(2);
            process.stdout.write(`${base}\n${head}\n`);
          ')
          test "${#phase3_event_shas[@]}" -eq 2
          phase3_base="${phase3_event_shas[0]}"
          phase3_head="${phase3_event_shas[1]}"
          git -C "$GITHUB_WORKSPACE" cat-file -e "${phase3_base}^{commit}"
          git -C "$GITHUB_WORKSPACE" cat-file -e "${phase3_head}^{commit}"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$phase3_head"
          phase3_expected_attestation="PHASE3_PRIVATE_ARTIFACT_HANDOFF protocol=phase3c-github-event-root-v2 event_head=$phase3_head"
          if git -C "$GITHUB_WORKSPACE" cat-file -e "${phase3_base}:${phase3_checker_rel}" 2>/dev/null; then
            phase3_trusted_root="$RUNNER_TEMP/phase3c-trusted-base-${phase3_base}"
            git -C "$GITHUB_WORKSPACE" worktree add --detach "$phase3_trusted_root" "$phase3_base"
            phase3_trusted_checker="$phase3_trusted_root/$phase3_checker_rel"
            phase3_attestation="$(cd "$phase3_trusted_root" && node "$phase3_trusted_checker" --github-event --root "$GITHUB_WORKSPACE" --attest-github-handoff)"
            test "$phase3_attestation" = "$phase3_expected_attestation" || { echo 'trusted base containment checker failed the candidate-root handoff protocol' >&2; exit 1; }
          else
            git -C "$GITHUB_WORKSPACE" merge-base --is-ancestor "$phase3_bootstrap_ancestor" "$phase3_base" || { echo "trusted base containment checker is missing outside the initial bootstrap ancestry; refusing candidate fallback: expected ancestor $phase3_bootstrap_ancestor, event base $phase3_base" >&2; exit 1; }
            phase3_checker_history="$(git -C "$GITHUB_WORKSPACE" rev-list --full-history --max-count=1 "${phase3_bootstrap_ancestor}..${phase3_base}" -- "$phase3_checker_rel")" || { echo 'failed to inspect trusted containment checker history; refusing candidate fallback' >&2; exit 1; }
            test -z "$phase3_checker_history" || { echo 'trusted base containment checker was previously present; refusing candidate fallback after removal' >&2; exit 1; }
            git -C "$GITHUB_WORKSPACE" cat-file -e "${phase3_head}:${phase3_checker_rel}" 2>/dev/null || { echo 'PR branch predates the containment checker — update this branch from main' >&2; exit 1; }
            phase3_candidate_entry="$(git -C "$GITHUB_WORKSPACE" ls-tree "$phase3_head" -- "$phase3_checker_rel")"
            phase3_candidate_oid="$(git -C "$GITHUB_WORKSPACE" rev-parse "${phase3_head}:${phase3_checker_rel}")" || { echo 'PR branch predates the containment checker — update this branch from main' >&2; exit 1; }
            case "$phase3_candidate_entry" in
              "100644 blob ${phase3_candidate_oid}"$'\t'"${phase3_checker_rel}"|"100755 blob ${phase3_candidate_oid}"$'\t'"${phase3_checker_rel}") ;;
              *) echo 'initial bootstrap containment checker is not an exact regular blob at the required path' >&2; exit 1 ;;
            esac
            test -f "$GITHUB_WORKSPACE/$phase3_checker_rel"
            test "$(git -C "$GITHUB_WORKSPACE" hash-object -- "$phase3_checker_rel")" = "$phase3_candidate_oid"
            git -C "$GITHUB_WORKSPACE" diff --no-ext-diff --quiet "$phase3_head" -- "$phase3_checker_rel"
            git -C "$GITHUB_WORKSPACE" diff --cached --no-ext-diff --quiet "$phase3_head" -- "$phase3_checker_rel"
            # Candidate-controlled coverage exists only to introduce this
            # guard. The exact committed blob/path checks above make that
            # bootstrap boundary explicit and auditable.
            phase3_attestation="$(node "$GITHUB_WORKSPACE/$phase3_checker_rel" --github-event --root "$GITHUB_WORKSPACE" --attest-github-handoff)"
            test "$phase3_attestation" = "$phase3_expected_attestation" || { echo 'initial bootstrap containment checker failed the candidate-root handoff protocol' >&2; exit 1; }
          fi

      - name: Reject pushed packet blobs with the exact trusted current checker
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          node --version
          node scripts/check-supplier-pricing-phase3-private-artifacts.mjs --github-event --root "$GITHUB_WORKSPACE"

  ci-scope:
    name: Classify CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: phase3-private-artifact-containment
    if: ${{ always() }}
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      full_ci: ${{ steps.scope.outputs.full_ci }}
      reason: ${{ steps.scope.outputs.reason }}
      changed_count: ${{ steps.scope.outputs.changed_count }}
      event_route: ${{ steps.scope.outputs.event_route }}
      prior_full_proof: ${{ steps.scope.outputs.prior_full_proof }}
    steps:
      - name: Bind containment result before classifying candidate paths
        env:
          CONTAINMENT_RESULT: ${{ needs.phase3-private-artifact-containment.result }}
        run: |
          test "$CONTAINMENT_RESULT" = "success" || {
            echo "Private-artifact containment did not pass: $CONTAINMENT_RESULT" >&2
            exit 1
          }

      - name: Checkout exact event history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Classify with the exact trusted comparison-base implementation
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          classifier_rel='scripts/classify-ci-scope.mjs'
          mapfile -t event_values < <(node --input-type=commonjs -e '
            const fs = require("node:fs");
            const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
            const sha = value => typeof value === "string" && /^[0-9a-f]{40}$/i.test(value) ? value.toLowerCase() : null;
            if (process.env.EVENT_NAME === "pull_request") {
              const base = sha(event?.pull_request?.base?.sha);
              const head = sha(event?.pull_request?.head?.sha);
              if (!base || !head) process.exit(2);
              process.stdout.write(`pull_request\n${base}\n${head}\n`);
            } else if (process.env.EVENT_NAME === "push") {
              const base = sha(event?.before);
              const head = sha(event?.after);
              if (!base || !head) process.exit(2);
              process.stdout.write(`push\n${base}\n${head}\n`);
            } else {
              process.exit(2);
            }
          ')
          test "${#event_values[@]}" -eq 3
          event_mode="${event_values[0]}"
          compare_base="${event_values[1]}"
          compare_head="${event_values[2]}"
          test "$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)" = "$compare_head"
          git -C "$GITHUB_WORKSPACE" cat-file -e "${compare_head}^{commit}"

          emit_full_bootstrap() {
            {
              echo 'docs_only=false'
              echo 'full_ci=true'
              echo 'reason=trusted-classifier-unavailable'
              echo 'changed_count=0'
              echo 'event_route=force-full'
              echo 'prior_full_proof=false'
            } >> "$GITHUB_OUTPUT"
            echo 'Trusted comparison base has no CI-scope classifier; forcing complete CI.'
          }

          case "$compare_base" in
            0000000000000000000000000000000000000000)
              emit_full_bootstrap
              exit 0
              ;;
          esac
          if ! git -C "$GITHUB_WORKSPACE" cat-file -e "${compare_base}^{commit}" 2>/dev/null; then
            emit_full_bootstrap
            exit 0
          fi

          if ! git -C "$GITHUB_WORKSPACE" cat-file -e "${compare_base}:${classifier_rel}" 2>/dev/null; then
            emit_full_bootstrap
            exit 0
          fi

          classifier_entry="$(git -C "$GITHUB_WORKSPACE" ls-tree "$compare_base" -- "$classifier_rel")"
          classifier_oid="$(git -C "$GITHUB_WORKSPACE" rev-parse "${compare_base}:${classifier_rel}")"
          case "$classifier_entry" in
            "100644 blob ${classifier_oid}"$'\t'"${classifier_rel}"|"100755 blob ${classifier_oid}"$'\t'"${classifier_rel}") ;;
            *) echo 'Trusted CI-scope classifier is not an exact regular blob; refusing fast routing.' >&2; exit 1 ;;
          esac

          trusted_root="$RUNNER_TEMP/ci-scope-trusted-${compare_base}"
          git -C "$GITHUB_WORKSPACE" worktree add --detach "$trusted_root" "$compare_base"
          trusted_classifier="$trusted_root/$classifier_rel"
          test -f "$trusted_classifier"
          test "$(git -C "$trusted_root" hash-object -- "$classifier_rel")" = "$classifier_oid"
          classifier_output="$RUNNER_TEMP/ci-scope-output-${compare_head}"
          {
            # Bootstrap compatibility: the first introducing PR executes the
            # older trusted-base classifier, which does not emit these keys.
            echo 'event_route=code'
            echo 'prior_full_proof=false'
          } > "$classifier_output"
          if ! node "$trusted_classifier" \
            --repo-root "$GITHUB_WORKSPACE" \
            --event-name "$event_mode" \
            --base "$compare_base" \
            --head "$compare_head" \
            --event-path "$GITHUB_EVENT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --current-run-id "$GITHUB_RUN_ID" \
            --github-output "$classifier_output"; then
            emit_full_bootstrap
            exit 0
          fi
          cat "$classifier_output" >> "$GITHUB_OUTPUT"

  sql-validation:
    name: SQL Migration Validation
    runs-on: ubuntu-latest
    needs: [phase3-private-artifact-containment, ci-scope]
    # SQL Validation is a required branch-protection context; containment is not.
    # Always start this job so a failed/cancelled containment dependency becomes
    # a required red result instead of a skipped result that GitHub may accept.
    if: ${{ always() }}
    # Fast (no node_modules); runs on every push and PR. Catches commits that
    # bypassed husky locally (e.g. via --no-verify or a non-husky environment)
    # by re-running the full migration audit at the PR/push gate.
    steps:
      - name: Bind containment and trusted routing into this required check
        env:
          CONTAINMENT_RESULT: ${{ needs.phase3-private-artifact-containment.result }}
          CI_SCOPE_RESULT: ${{ needs.ci-scope.result }}
        run: |
          test "$CONTAINMENT_RESULT" = "success" || {
            echo "Private-artifact containment did not pass: $CONTAINMENT_RESULT" >&2
            exit 1
          }
          test "$CI_SCOPE_RESULT" = "success" || {
            echo "Trusted CI-scope classification did not pass: $CI_SCOPE_RESULT" >&2
            exit 1
          }

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Make scripts executable
        run: chmod +x scripts/validate-sql.sh scripts/validate-sql-migrations.sh

      - name: Validate every migration (full audit, baseline-ratcheted)
        # Scans all supabase/migrations/*.sql for known anti-patterns:
        # pg_get_functiondef, updated_at on tables without that column,
        # SECURITY DEFINER without search_path, idempotency_keys column
        # name mistakes. Legacy migrations contain bugs that were superseded
        # by later fixes — the baseline lets CI accept those while still
        # failing on any NEW violation. Lower the baseline when violations
        # decrease to lock in the improvement.
        # 2026-05-06: bumped from 20 to 61 to match the actual current state.
        # The baseline drifted as new migrations (mostly the Mar-31 admin
        # correction phases and Mar-32 void cascades) inherited the legacy
        # idempotency-keys column-name bugs and pg_get_functiondef pattern.
        # Wave A's explicit-rewrite migrations (20260506190000) start the
        # ratchet downward. Lower this number whenever a wave reduces it.
        run: bash scripts/validate-sql-migrations.sh --max-violations=61

      - name: Migration hard-rules self-test
        # Runner-bundled Node only; the checker and its tests import nothing
        # outside node: builtins, so this job still needs no node_modules.
        run: node scripts/check-migration-hard-rules.test.mjs

      - name: Migration hard rules (no edited applied migration; new tables carry RLS + policy)
        # 2026-09-03: two CRX Hard Rules that were enforced only by CodeRabbit
        # (an AI reviewer the author can override) and by local Claude hooks
        # (which fire only when Claude is the writer) now have a deterministic
        # check. "Applied" = exists at the merge-base AND not newer than the
        # applied high-water mark in the BASE tree's .claude/schema-registry.json;
        # the base tree is used so a PR cannot widen the pending band by editing
        # the registry. Unreadable registry = every base migration is applied.
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.event.after }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            compare_base="$PR_BASE_SHA"
            compare_head="$PR_HEAD_SHA"
          else
            compare_base="$PUSH_BEFORE_SHA"
            compare_head="$PUSH_AFTER_SHA"
          fi
          node scripts/check-migration-hard-rules.mjs --base "$compare_base" --head "$compare_head"

  lint-typecheck-build:
    name: Lint, Type Check, Build
    runs-on: ubuntu-latest
    needs: [phase3-private-artifact-containment, ci-scope]
    # 2026-10-21: the former single required job ran every step below and the
    # two test jobs after it one at a time (median 13.9 min, 17.3 min end to
    # end). They now run side by side; "Lint, Type Check, Test, Build" below
    # stays the required check and turns red unless every part passed. This
    # part runs in both lanes because the documentation checks always run.
    if: ${{ needs.phase3-private-artifact-containment.result == 'success' && needs.ci-scope.result == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: CodeRabbit final-review gate regression tests
        run: node .github/scripts/coderabbit-final-review.test.cjs

      - name: Cache node_modules
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        uses: actions/cache@v6
        id: cache-node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Check for vulnerable dependencies
        # 2026-09-02: raised critical -> high on Mason's approval. At `critical`
        # a HIGH advisory passed the gate: browserslist GHSA-c83g-rgw3-j3cx was
        # live on main that morning with CI green, and GitHub was reporting it on
        # every push while this step said nothing. Dependabot security updates
        # are enabled, so the fix PRs arrive on their own (#554 landed the
        # browserslist bump); this makes the gate notice when one is outstanding
        # instead of only mentioning it in push output nobody reads.
        # Verified before the raise: with main's current lockfile only one
        # MODERATE advisory remains (@humanfs/node), so this passes today.
        # Do NOT lower it back to critical to get a red PR green — bump the
        # dependency, or let the Dependabot PR land first.
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        run: npm audit --audit-level=high

      - name: CI scope routing regression tests
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        run: npm run test:ci-scope

      - name: Run ESLint
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        run: npm run lint

      - name: Run TypeScript type check
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        run: npm run typecheck

      - name: Detect Edge Function changes
        # 2026-09-03: supabase/functions/ is Deno, so tsc and vitest never see
        # it; two test files existed there that nothing ran. The Deno steps
        # below run only when a function changed against the merge-base, and
        # are SKIPPED otherwise (visible in the job, never a vacuous pass).
        id: edge-scope
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            compare_base="$PR_BASE_SHA"
          else
            compare_base="$PUSH_BEFORE_SHA"
          fi
          changed=true
          if [ "$compare_base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${compare_base}^{commit}" 2>/dev/null; then
            merge_base="$(git merge-base "$compare_base" HEAD)"
            if git diff --quiet "$merge_base" HEAD -- supabase/functions; then
              changed=false
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "Edge Function files changed since base: $changed"

      - name: Set up Deno (Edge Functions changed)
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' && steps.edge-scope.outputs.changed == 'true' }}
        uses: denoland/setup-deno@v2
        with:
          deno-version: '2.9.4'

      - name: Edge Function type check (Deno)
        # --node-modules-dir=none: the repo root has a package.json, which makes
        # Deno look for `npm:` specifiers in node_modules instead of its own
        # cache; the functions are deployed without that node_modules.
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' && steps.edge-scope.outputs.changed == 'true' }}
        run: deno check --node-modules-dir=none supabase/functions/*/index.ts

      - name: Edge Function unit tests (Deno)
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' && steps.edge-scope.outputs.changed == 'true' }}
        run: deno test --no-prompt --node-modules-dir=none supabase/functions

      - name: Documentation consistency
        run: npm run check:docs

      - name: Workflow map freshness (ignore generated date stamp)
        shell: bash
        run: |
          set -euo pipefail
          before="$(mktemp)"
          after="$(mktemp)"
          sed -E 's/Updated [^<]+/Updated <date>/' docs/app-workflow-map.html > "$before"
          node scripts/generate-workflow-map.mjs
          sed -E 's/Updated [^<]+/Updated <date>/' docs/app-workflow-map.html > "$after"
          diff -u "$before" "$after"

      - name: Build (Vite)
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: npm run build

  unit-tests:
    name: Unit Tests and Coverage (Vitest)
    runs-on: ubuntu-latest
    needs: [phase3-private-artifact-containment, ci-scope]
    # Full lane only. The required check below accepts this job as skipped
    # only when the trusted classifier chose the documentation-only route.
    if: ${{ needs.phase3-private-artifact-containment.result == 'success' && needs.ci-scope.result == 'success' && needs.ci-scope.outputs.full_ci == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Cache node_modules
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        uses: actions/cache@v6
        id: cache-node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Run Vitest unit tests + coverage (ratchet thresholds)
        # Unit/coverage tests deliberately use the mock Supabase values from
        # vite.config.ts. Live schema verification stays a trusted opt-in run
        # until a least-privilege CI credential or disposable database exists.
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' && !cancelled() }}
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  regression-tests:
    name: Guard, Packet, and Contract Regression Tests
    runs-on: ubuntu-latest
    needs: [phase3-private-artifact-containment, ci-scope]
    # Full lane only. The required check below accepts this job as skipped
    # only when the trusted classifier chose the documentation-only route.
    if: ${{ needs.phase3-private-artifact-containment.result == 'success' && needs.ci-scope.result == 'success' && needs.ci-scope.outputs.full_ci == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Cache node_modules
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        uses: actions/cache@v6
        id: cache-node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' && steps.cache-node-modules.outputs.cache-hit != 'true' }}
        run: npm ci

      - name: Guard-hook regression tests (safety net must not regress)
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        run: npm run test:correction-guards

      - name: Phase 3C private-artifact regression tests
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        run: npm run test:supplier-pricing-phase3c-packet

      - name: Phase 2 live-smoke static guard
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        run: npm run check:pricing-phase2-live-smoke

      - name: Agent workflow truth-state and sync tests
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        run: npm run test:agent-workflows

      - name: RPC contract and idempotency inventory tests
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' }}
        run: npm run test:contracts

  lint-typecheck-test:
    name: Lint, Type Check, Test, Build
    runs-on: ubuntu-latest
    needs: [phase3-private-artifact-containment, ci-scope, sql-validation, lint-typecheck-build, unit-tests, regression-tests, phase3c-containment-windows, guard-hooks-windows]
    # This is a required branch-protection context. It must execute and turn a
    # failed prerequisite red; a conditionally skipped job reports success.
    if: ${{ always() }}

    steps:
      - name: Bind all prerequisite results into this required check
        env:
          CONTAINMENT_RESULT: ${{ needs.phase3-private-artifact-containment.result }}
          CI_SCOPE_RESULT: ${{ needs.ci-scope.result }}
          SQL_VALIDATION_RESULT: ${{ needs.sql-validation.result }}
          LINT_BUILD_RESULT: ${{ needs.lint-typecheck-build.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          REGRESSION_TESTS_RESULT: ${{ needs.regression-tests.result }}
          WINDOWS_PACKET_RESULT: ${{ needs.phase3c-containment-windows.result }}
          WINDOWS_GUARD_RESULT: ${{ needs.guard-hooks-windows.result }}
          FULL_CI: ${{ needs.ci-scope.outputs.full_ci }}
        run: |
          test "$CONTAINMENT_RESULT" = "success" || { echo "Private-artifact containment did not pass: $CONTAINMENT_RESULT" >&2; exit 1; }
          test "$CI_SCOPE_RESULT" = "success" || { echo "Trusted CI-scope classification did not pass: $CI_SCOPE_RESULT" >&2; exit 1; }
          test "$SQL_VALIDATION_RESULT" = "success" || { echo "SQL validation did not pass: $SQL_VALIDATION_RESULT" >&2; exit 1; }
          test "$LINT_BUILD_RESULT" = "success" || { echo "Lint, type check, and build did not pass: $LINT_BUILD_RESULT" >&2; exit 1; }
          # The test parts may be skipped only on the trusted documentation-only
          # route. On the full route anything but success is red.
          case "$FULL_CI" in
            true) expected_tests="success" ;;
            false) expected_tests="skipped" ;;
            *) echo "Trusted full_ci output is invalid: $FULL_CI" >&2; exit 1 ;;
          esac
          test "$UNIT_TESTS_RESULT" = "$expected_tests" || { echo "Unit tests: expected $expected_tests, got $UNIT_TESTS_RESULT (full_ci=$FULL_CI)" >&2; exit 1; }
          test "$REGRESSION_TESTS_RESULT" = "$expected_tests" || { echo "Regression tests: expected $expected_tests, got $REGRESSION_TESTS_RESULT (full_ci=$FULL_CI)" >&2; exit 1; }
          test "$WINDOWS_PACKET_RESULT" = "$expected_tests" || { echo "Windows packet tests: expected $expected_tests, got $WINDOWS_PACKET_RESULT (full_ci=$FULL_CI)" >&2; exit 1; }
          test "$WINDOWS_GUARD_RESULT" = "$expected_tests" || { echo "Windows guard tests: expected $expected_tests, got $WINDOWS_GUARD_RESULT (full_ci=$FULL_CI)" >&2; exit 1; }

      - name: Report trusted CI route
        env:
          DOCS_ONLY: ${{ needs.ci-scope.outputs.docs_only }}
          FULL_CI: ${{ needs.ci-scope.outputs.full_ci }}
          ROUTE_REASON: ${{ needs.ci-scope.outputs.reason }}
          CHANGED_COUNT: ${{ needs.ci-scope.outputs.changed_count }}
          EVENT_ROUTE: ${{ needs.ci-scope.outputs.event_route }}
          PRIOR_FULL_PROOF: ${{ needs.ci-scope.outputs.prior_full_proof }}
        run: |
          case "$DOCS_ONLY:$FULL_CI" in
            true:false|false:true) ;;
            *) echo "Trusted CI route is not a valid mutually-exclusive result: docs_only=$DOCS_ONLY full_ci=$FULL_CI" >&2; exit 1 ;;
          esac
          case "$EVENT_ROUTE:$PRIOR_FULL_PROOF" in
            code:false|force-full:false|error:false|metadata:false|metadata:true) ;;
            *) echo "Trusted event route is invalid: event_route=$EVENT_ROUTE prior_full_proof=$PRIOR_FULL_PROOF" >&2; exit 1 ;;
          esac
          echo "CI route: docs_only=$DOCS_ONLY full_ci=$FULL_CI reason=$ROUTE_REASON changed_count=$CHANGED_COUNT event_route=$EVENT_ROUTE prior_full_proof=$PRIOR_FULL_PROOF"

      - name: Write exact full-CI proof
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' && github.event_name == 'pull_request' }}
        shell: bash
        env:
          PROOF_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROOF_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROOF_PATH: ${{ runner.temp }}/crx-full-ci-proof.json
        run: |
          set -euo pipefail
          node --input-type=commonjs -e '
            const fs = require("node:fs");
            const sha = value => typeof value === "string" && /^[0-9a-f]{40}$/i.test(value) ? value.toLowerCase() : null;
            const base = sha(process.env.PROOF_BASE_SHA);
            const head = sha(process.env.PROOF_HEAD_SHA);
            if (!base || !head || !process.env.PROOF_PATH) process.exit(2);
            fs.writeFileSync(process.env.PROOF_PATH, `${JSON.stringify({ schema: 1, kind: "crx-full-ci-proof", base, head, run_id: process.env.GITHUB_RUN_ID, run_attempt: process.env.GITHUB_RUN_ATTEMPT })}\n`, { encoding: "utf8", flag: "wx" });
          '

      - name: Publish exact full-CI proof
        if: ${{ needs.ci-scope.outputs.full_ci == 'true' && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: crx-full-ci-proof-${{ github.event.pull_request.base.sha }}-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/crx-full-ci-proof.json
          if-no-files-found: error
          retention-days: 14

  phase3c-containment-windows:
    name: Phase 3C Containment (Windows)
    runs-on: windows-latest
    needs: [phase3-private-artifact-containment, ci-scope]
    if: ${{ needs.phase3-private-artifact-containment.result == 'success' && needs.ci-scope.result == 'success' && needs.ci-scope.outputs.full_ci == 'true' }}
    timeout-minutes: 15
    # 2026-10-21: the packet suite (~5 min) and the guard-hook suite (~6 min)
    # used to run one after the other in this job; each now has its own
    # Windows job so they finish together.
    # The containment checker folds path case on win32 only, because that is the
    # platform whose filesystem compares paths case-insensitively. Every other
    # job here is ubuntu-latest, so those branches would never execute and the
    # Windows-specific behavior could silently regress. This suite imports only
    # Node builtins and sibling scripts, so it needs Git and Node but no
    # `npm ci` -- keeping the extra Windows leg to roughly a minute.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Phase 3C private-artifact regression tests (win32 path semantics)
        # The hosted runner points TEMP at an 8.3 short path
        # (`C:\Users\RUNNER~1\...`). Node's `os.tmpdir()`/`realpathSync` keep the
        # short form while Git expands it, so a fixture repository created under
        # the default TEMP can never equal `git rev-parse --show-toplevel` and
        # every canonical-root check fails. `runner.temp` is a plain long path.
        env:
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        run: node scripts/supplier-pricing-phase3-private-artifacts.test.mjs

  guard-hooks-windows:
    name: Guard-Hook Regression Tests (Windows)
    runs-on: windows-latest
    needs: [phase3-private-artifact-containment, ci-scope]
    if: ${{ needs.phase3-private-artifact-containment.result == 'success' && needs.ci-scope.result == 'success' && needs.ci-scope.outputs.full_ci == 'true' }}
    timeout-minutes: 15
    # Same win32 rationale as the job above, for the guard-hook suite.
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Report 8.3 short-name generation on the runner volumes
        # 2026-09-05 (Codex GitHub App P2 on #612): review-proof-guard.test.mjs
        # carries Windows 8.3 short-name alias cases. They run only when the
        # volume holding the test fixture (TEMP) hands out aliases; otherwise the
        # test prints a skip note. Measured on windows-latest (PR #620): 8dot3
        # name creation is ENABLED on C: and DISABLED on D:, which holds both the
        # checkout and `runner.temp`, so a fixture under `runner.temp` never gets
        # an alias. The guard suite below therefore uses a long-form directory on
        # C: (a plain long path, unlike the default TEMP's `RUNNER~1` short form,
        # so the Git-toplevel comparison above still holds). This step prints the
        # per-volume setting and lists a fresh long-named probe file on each
        # candidate volume with `dir /x`, so the log shows which one aliases.
        shell: pwsh
        env:
          RUNNER_TEMP_ROOT: ${{ runner.temp }}
          GUARD_TEMP_ROOT: C:\crx-guard-temp
        run: |
          $volumes = @("C:", (Split-Path -Qualifier $env:GITHUB_WORKSPACE), (Split-Path -Qualifier $env:RUNNER_TEMP_ROOT)) | Select-Object -Unique
          foreach ($volume in $volumes) {
            Write-Host "--- fsutil 8dot3name query $volume"
            fsutil 8dot3name query $volume
          }
          foreach ($root in @($env:RUNNER_TEMP_ROOT, $env:GUARD_TEMP_ROOT)) {
            $probe = Join-Path $root "eight-dot-three-probe"
            New-Item -ItemType Directory -Force -Path $probe | Out-Null
            Set-Content -Path (Join-Path $probe "codex-review-0123abcd.json") -Value "{}"
            Write-Host "--- dir /x $probe (a ~1 entry in the short-name column means aliases are generated)"
            cmd /c dir /x $probe
          }

      - name: Guard-hook regression tests (win32 alias and path semantics)
        # 2026-09-05: the same suite regression-tests runs on Ubuntu. Here it
        # executes the win32-only branches — the 8.3 alias cases, the `dir /x`
        # parser, and realpathSync.native handling — that skip on every other
        # platform, so before this step they ran nowhere in CI. Every file in
        # the suite imports only Node builtins and sibling scripts, so no
        # `npm ci` is needed. TEMP points at the C: directory the probe step
        # created, because that is the volume that generates 8.3 aliases; the
        # test prints "no 8.3 aliases on this volume" if that ever stops holding.
        env:
          TMP: C:\crx-guard-temp
          TEMP: C:\crx-guard-temp
        run: npm run test:correction-guards

  e2e-smoke:
    name: E2E Smoke Tests
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    # ─── DISABLED 2026-05-18 ────────────────────────────────────────────
    # The production safety guard added in PR #59
    # (tests/e2e/utils/safety-guards.ts) refuses to run E2E against the
    # prod Supabase project. Staging project (PR-23 / Task 4) is not yet
    # created, so on every push to main this job fails by design.
    #
    # TO RE-ENABLE:
    #   1. Create the `crx-manager-staging` Supabase project.
    #   2. Add GitHub secrets STAGING_SUPABASE_URL + STAGING_SUPABASE_ANON_KEY.
    #   3. Add staging-only E2E_TEST_EMAIL + E2E_TEST_PASSWORD credentials.
    #   4. Migrate every direct production endpoint in tests/e2e to the
    #      canonical E2E staging environment (the config blocks until then).
    #   5. Prove the staging values pass the fail-closed Playwright config.
    #   6. Change `if: false` back to `if: github.event_name == 'push'`.
    if: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Cache node_modules
        uses: actions/cache@v6
        id: cache-node-modules
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E smoke tests
        env:
          E2E_TARGET_ENV: staging
          E2E_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          CI: true
        run: npm run test:e2e:smoke

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 14

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-smoke-screenshots
          path: test-results/
          retention-days: 7
