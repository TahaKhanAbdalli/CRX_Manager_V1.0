# CodeRabbit configuration for CRX Manager
# Docs: https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

# "assertive" = report everything and let a later pass filter. Mason's call,
# 2026-08-24, reversing the earlier "chill" setting.
#
# Why the reversal: `chill` is not a cost control, it is an instruction to the
# reviewer to report less. That is the exact anti-pattern the Opus-5 tuning
# section of AGENTS.md forbids for review prompts - ask for every finding and
# filter afterwards, because a model told to be conservative obeys literally and
# finds less. Billing is per FILE REVIEWED (25c/file over the included limit),
# never per comment, so this buys coverage for nothing but extra reading.
reviews:
  profile: assertive

  # OFF since 2026-10-19 (Mason: "cut CodeRabbit volume" and "not force to have
  # a review"). CodeRabbit is ADVISORY: it leaves comments and never submits an
  # APPROVED or CHANGES_REQUESTED verdict, so it can neither unlock nor hold a
  # merge. Mason removed the protect-main approving-review requirement the same
  # day. Merges now rest on the required checks, the exact-SHA Sol proof (except
  # documentation-only changes) and the agent merge gates, which still refuse any
  # PR whose GitHub reviewDecision is CHANGES_REQUESTED. Agents fix or answer every
  # CodeRabbit comment that arrives before the merge (.claude/commands/ship.md).
  #
  # The pre_merge_checks below are all `warning` mode now: a failed one is a
  # finding to fix or refute, never a red status that holds the merge.
  request_changes_workflow: false
  high_level_summary: true
  # Put the summary in the walkthrough COMMENT, never in the PR description
  # (2026-09-26, autonomous landing). Writing the description is a PR `edited`
  # event, and ci.yml re-runs its ~11-minute required jobs on `edited`. So every
  # review restarted CI under the lifecycle check that was waiting on it, and the
  # check died "in_progress ... dispatch state was preserved" (PR #794 runs
  # 36091053453/36091203653: the second run's actor was coderabbitai[bot]).
  high_level_summary_in_walkthrough: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  # Report sections (sequence diagrams, related PRs/issues, linked-issue
  # assessment, suggested labels/reviewers, changed-files summary) are left at
  # their defaults - ON. Mason's call, 2026-08-20: he raised the usage spending
  # cap rather than trade any possible review context for a cheaper report.
  # Deliberate: do not turn these off to save spend.

  # There is deliberately NO `path_filters` block here. This config is
  # exclusion-only BY DESIGN, and right now the exclusion list is empty.
  #
  # DO NOT add a positive (non-`!`) pattern. Both CodeRabbit and the Codex
  # reviewer recommended adding `**/package-lock.json` to override CodeRabbit's
  # default lockfile ignore. Applied literally on FarmRx PR #26 (2026-08-20)
  # that advice returned "No files to review": once ANY positive pattern
  # exists, only files matching a positive pattern are reviewed, so the one
  # changed file - .coderabbit.yaml itself - was dropped. A single well-meant
  # line silently switched off code review for the whole repo, and it reads as
  # a clean pass rather than as a config error. A leading `**` restores
  # default-include breadth but ALSO opts out of CodeRabbit's curated default
  # ignore list (node_modules, build output, generated code, binaries, media,
  # source maps), which then has to be hand-maintained. FarmRx carries that
  # form because a lockfile has shipped there as the sole functional change.
  # CRX stays exclusion-only.
  #
  # Known, accepted gap: a PR changing ONLY package-lock.json is skipped by
  # CodeRabbit's own default ignore list, so version bumps and integrity
  # hashes go uninspected. That predates this config and is NOT closed here.
  #
  # The bar for adding ANY exclusion later: name the mechanism that makes those
  # files inert, and point at the check that fails if they stop being inert. A
  # directory name is never that mechanism. Four review rounds on PR #441
  # removed four doc-root exclusions (`docs/audits/`, `docs/loops/`,
  # `docs/build-loops/`, `docs/handoffs/`, then `docs/archive/`) because each
  # one turned out to hide files that automation READS AND EXECUTES - loop
  # prompts, audit prompts, handoffs, and JSON ledgers. On a public repo an
  # excluded agent-control file is a prompt-injection path into privileged
  # automation, not a cost-control question. Every document under docs/ is
  # reviewed today. The exclusion work, and the repository-walking test that
  # enforces this rule, are parked in PR #441.

  # ONE automatic review per PR (Mason, 2026-10-19, "cut CodeRabbit volume").
  # CodeRabbit reviews a non-draft PR when it opens or is marked ready, and NOT
  # again on later pushes: every push used to buy a fresh paid review, which made
  # CodeRabbit the bottleneck and the largest review bill. PRs are opened as
  # drafts (unreviewed) and marked ready once the head is frozen, so that single
  # review lands on the finished change. Titles containing "docs(" are skipped
  # entirely: documentation records need no outside review. Agents never post
  # `@coderabbitai review` to buy a re-review (.claude/commands/ship.md); the one
  # exception is a single `@coderabbitai full review` on a money or Mason-named PR
  # (Mason, 2026-10-21; docs/reference/coderabbit-native-review.md).
  #
  # History: 2026-09-26 turned on a review of every push because the merge gates
  # then required CodeRabbit's APPROVED verdict on the exact head. That
  # requirement is gone (see request_changes_workflow above).
  auto_review:
    enabled: true
    auto_incremental_review: false
    # 0 = never pause. The default (5) silently stops reviewing a PR after five
    # reviewed pushes, which is exactly when a long fix loop most needs one.
    auto_pause_after_reviewed_commits: 0
    drafts: false
    description_keyword: ""
    ignore_title_keywords:
      - "docs("

  # Project-specific review guidance. These mirror the "CRX Hard Rules" in
  # AGENTS.md so CodeRabbit flags the exact mistakes that have bitten this
  # codebase before, not just generic style.
  path_instructions:
    - path: "supabase/migrations/**"
      instructions: >-
        This is a Supabase (PostgreSQL) migration for a live production app.
        Flag as high severity: any new table that does NOT enable Row Level
        Security (RLS) with policies in the same file; any SECURITY DEFINER
        function missing `SET search_path = public, pg_temp`; any mutating RPC
        that does not accept and enforce `p_idempotency_key text DEFAULT NULL`;
        any GRANT EXECUTE to anon/public on a function that writes data; any
        edit to an already-applied migration (migrations must be new files
        only). Money must be exact whole cents - never floating point. New
        money storage uses bigint cents; any new or changed money column must
        carry a finite whole-cent CHECK constraint named
        `<table>_<column>_whole_cents_chk`. A CHECK constraint that changes
        allowed status values must include all previously allowed values.
        Timestamps on the live database are UTC: flag any business-day,
        cutoff, or period-boundary logic that does not convert explicitly to
        America/Chicago.
    - path: "src/**"
      instructions: >-
        React 18 + TypeScript frontend for a live app. Flag: money handled as
        floating-point instead of integer cents; money math that does
        arithmetic on decimal strings or floats instead of parsing operands
        into integer cents FIRST; missing `assertRpcResult()` after an RPC call
        or `checkMutationResult()` after `.update()` / `.delete()`; use of
        `confirm()`, `window.confirm()`, or `alert()` instead of the shared
        ConfirmModal / toast components; writes to generated columns such as
        `invoices.balance_cents`; Supabase clients created anywhere other than
        `src/lib/db.ts`; Sentry imported from anywhere other than
        `src/lib/sentry`; any hardcoded secret, API key, or service_role key in
        frontend code. Timestamps from the database are UTC - flag business-day
        or period logic that does not convert explicitly to America/Chicago.
    # Two patterns, not one: `src/**/*[Bb]lend*` matches only the FILENAME
    # component, so it catches src/pages/BlendTickets.tsx but misses
    # src/components/blendtickets/BulkTicketUpload.tsx. The directory form
    # covers everything inside a blend-named folder. Raised by the Codex
    # reviewer on PR #441 - an earlier `git ls-files` check was a misleading
    # oracle here, because git pathspec globbing is not CodeRabbit's matcher.
    - path: "src/**/[Bb]lend*/**"
      instructions: >-
        Blend tickets are a MONEY path, not just an agronomy form: billing is
        driven by `rate_per_acre`, and a blank or missing unit still bills.
        Review any change here with the same severity as invoice or payment
        code. Flag unit handling that can silently mix measures (for example
        adding gallons to pounds), a missing or unvalidated unit that still
        reaches a billed amount, and any rate/quantity math that is not exact
        integer-cent arithmetic.
    - path: "src/**/*[Bb]lend*"
      instructions: >-
        Blend tickets are a MONEY path, not just an agronomy form: billing is
        driven by `rate_per_acre`, and a blank or missing unit still bills.
        Review any change here with the same severity as invoice or payment
        code. Flag unit handling that can silently mix measures (for example
        adding gallons to pounds), a missing or unvalidated unit that still
        reaches a billed amount, and any rate/quantity math that is not exact
        integer-cent arithmetic.
    - path: "supabase/functions/**"
      instructions: >-
        Supabase Edge Functions. Flag missing or inconsistent CORS handling,
        and any secret/service-role key that is logged or returned to the
        client.

  # Pre-merge checks turn the CRX Hard Rules from prose in AGENTS.md into
  # something a PR is measured against before it lands. Custom checks require
  # the Pro+ plan; this org is on Pro Plus (verified 2026-08-24).
  #
  # Approved by Mason 2026-08-24 when these produced a red X and withheld
  # approval under the former zero-required-review rule. Mason's 2026-08-28
  # protection change now requires a current approval, so an unresolved failed
  # check blocks the merge-unlocking approval unless the author explicitly uses
  # the documented "Ignore failed checks" override below.
  pre_merge_checks:
    # FALSE ON PURPOSE. False lets the PR AUTHOR override a failing check by
    # ticking "Ignore failed checks" in the Walkthrough comment. Mason authors
    # every PR in this repo, so flipping this to true would lock the only human
    # here out of his own override and turn a red check into a dead end.
    override_requested_reviewers_only: false

    # Off: this repo has no docstring convention, so an 80%-coverage warning on
    # every PR is pure noise - and noise on a review budget billed per file.
    docstrings:
      mode: "off"

    title:
      mode: warning
      requirements: >-
        Title must follow Conventional Commits: `type(scope): summary`, where
        type is one of feat, fix, chore, docs, test, refactor, perf, or build.
        The summary must describe what the change does, not which review round
        or PR iteration it came from.

    # Warning rather than error: a PR body that no longer matches its diff has
    # bitten this repo before, but blocking a real fix over prose is worse.
    description:
      mode: warning

    issue_assessment:
      mode: warning

    # ---- WARNING mode since 2026-10-19 (were `error`) ----------------------
    # CodeRabbit is advisory and reviews each PR once, so a failed check could
    # never be cleared by a re-review, and a red CodeRabbit status would hold the
    # merge gates (they refuse any red check) on a finding the agent already
    # fixed (Luna round 2). As warnings they stay findings the agent must fix or
    # refute (ship.md Step 8); the exact-SHA Sol review covers the same rules.
    # The "STAYS error" note on the applied-migration check below is history.
    # Every instruction below opens with an explicit skip clause, so a PR that
    # touches none of the named files passes trivially. That is deliberate: a
    # check that fires on unrelated docs and hook work gets ignored, and an
    # ignored check protects nothing.
    custom_checks:
      - name: New table without RLS
        mode: warning
        instructions: >-
          Scope: only files ADDED under supabase/migrations/. If this pull
          request adds no new file under supabase/migrations/, PASS immediately
          and state that the check did not apply.

          FAIL if any added migration contains a CREATE TABLE - in ANY schema,
          not only `public` - without BOTH of the following in the SAME file:
          (1) ALTER TABLE ... ENABLE ROW LEVEL SECURITY for that table, and (2)
          at least one CREATE POLICY targeting that table. A table created in a
          non-public schema such as `private` or `internal` is NOT exempt;
          AGENTS.md requires RLS and policies for every new table regardless of
          schema.

          Temporary tables are exempt. A permanent PARTITION is exempt ONLY when
          it inherits protection in practice: the parent carries RLS and the
          migration grants no direct access to the child. RLS is
          relation-specific, so a grant on a child partition reaches rows
          without going through the parent's policies - if this migration grants
          on the partition, or the parent's RLS cannot be confirmed, require RLS
          and a policy on the child too. Otherwise PASS.

      - name: SECURITY DEFINER without search_path
        mode: warning
        instructions: >-
          Scope: only files ADDED under supabase/migrations/. If this pull
          request adds no new file under supabase/migrations/, PASS immediately
          and state that the check did not apply.

          FAIL if any added migration defines a SECURITY DEFINER function that
          does not also carry an explicit SET search_path. Exactly two forms are
          acceptable, and nothing else:

          (a) the normal form `SET search_path = public, pg_temp`; or
          (b) an EXACTLY EMPTY search path (`SET search_path = ''`), which is the
          narrow exception approved 2026-07-30 and permitted ONLY when the
          function body is fully schema-qualified on every single reference. If
          the diff alone does not let you confirm that, FAIL and name the
          reference you could not confirm.

          Any OTHER value - for example `SET search_path = private, pg_temp` or
          any other non-empty custom path - is a FAIL even when every reference
          is schema-qualified. The approved exception is for an empty path, not
          for arbitrary restricted paths. Otherwise PASS.

      - name: Mutating RPC without idempotency key
        mode: warning
        instructions: >-
          Scope: only files ADDED under supabase/migrations/. If this pull
          request adds no new file under supabase/migrations/, PASS immediately
          and state that the check did not apply.

          The rule being enforced is AGENTS.md: "Mutating RPCs must accept and
          actually enforce `p_idempotency_key text DEFAULT NULL`." Apply that
          rule with judgement; the notes below exist to stop known
          misclassifications, not to replace reading the migration.

          CALLABLE. Do not infer callability from the presence of a GRANT, and
          split the two cases - `CREATE OR REPLACE FUNCTION` preserves the
          EXISTING ACL, so the same silence means opposite things:

          NEW function (no prior definition in the repo): PostgreSQL grants
          EXECUTE to PUBLIC by default, so silence means CALLABLE. Absence of a
          grant is not an exemption.

          RE-EMITTED via `CREATE OR REPLACE` (a definition already exists in an
          earlier migration): the prior ACL persists, INCLUDING an earlier
          REVOKE. Do NOT declare it callable merely because this migration does
          not repeat the REVOKE. Look for the earlier definition and its
          grants/revokes; a helper previously revoked from client roles stays
          private and is EXEMPT. If you cannot find the earlier ACL, say so and
          treat it as callable, naming what you could not resolve.

          DROPPED AND RECREATED (`DROP FUNCTION` then `CREATE FUNCTION`, the
          pattern this repo uses when consolidating overloads): this is a NEW
          object and the old ACL is GONE. It reverts to PostgreSQL's default
          PUBLIC EXECUTE. Treat it as CALLABLE unless this migration re-applies
          the REVOKE. Do not carry the dropped function's privacy forward.

          MUTATING. Include DELEGATED writes. A thin wrapper whose own body
          contains no INSERT/UPDATE/DELETE/MERGE but which calls a helper that
          performs them IS mutating - this repository uses the public-wrapper /
          internal-implementation pattern heavily. Inspect the callee before
          granting any exemption; if you cannot determine what the callee does,
          FAIL and say which callee you could not resolve.

          EXEMPT: trigger functions (RETURNS trigger), which cannot accept a
          caller-supplied key - `notify_team_note_assignment()` is a legitimate
          example already in this repo - and genuinely read-only functions.

          FAIL if any added migration creates or replaces a callable mutating
          function that does not both (1) accept `p_idempotency_key text DEFAULT
          NULL` and (2) actually use it to short-circuit or de-duplicate a
          repeated call. A parameter accepted and then ignored is a FAIL - the
          signature alone proves nothing.

          The claim must be SERIALIZED against concurrent callers. Two forms
          satisfy this and neither is a failure:

          (a) THE HOUSE PATTERN, which is the normal answer here:
          `check_idempotency()` / `check_idempotency_intent()` -> mutate ->
          `save_idempotency()`. Recording the key AFTER the mutation is correct
          in this form because the helper serializes the claim; several hundred
          migrations in this repository use it. PASS it. Do not demand
          `INSERT ... ON CONFLICT` from a migration that already uses the shared
          helpers - that would fail the repo's own audited standard and turn
          this check into noise.

          But check the WIRING, not just that both helper names appear. The
          exemption applies only when (i) the check and the save use the SAME
          operation key - checking `A` and saving under `B` means a retry never
          matches and the mutation runs again - and (ii) the function actually
          RETURNS the cached result when the check reports a prior receipt,
          rather than falling through and mutating anyway. If either is missing,
          FAIL and say which one.

          (b) A self-contained atomic claim, such as
          `INSERT ... ON CONFLICT DO NOTHING` against a unique idempotency
          record, with the mutation proceeding only when the claim was won.

          FAIL a HAND-ROLLED check-then-write that uses NEITHER: a plain SELECT
          for an existing key, then mutate, then record, with no shared helper
          and no unique-constraint claim. Two concurrent calls can both observe
          no prior key and both write. AGENTS.md requires the key to be
          "actually enforced", and a race that duplicates a money or inventory
          write enforces nothing. Otherwise PASS.

      - name: Money not exact whole cents
        mode: warning
        instructions: >-
          Scope: files under supabase/migrations/, src/, AND
          supabase/functions/. Edge Functions are TypeScript and are an
          authoritative money surface in this repo - process-document and
          process-blend-ticket already handle `unit_cost` and `price_per_unit` -
          so they are inside this guard, not outside it. If this pull request
          changes no file in any of those three locations, PASS immediately.

          FAIL on any of the following. (1) A NEWLY ADDED money column that is
          not bigint cents. This has NO numeric exception: AGENTS.md states that
          new money storage uses bigint cents, and the PostgreSQL numeric-dollar
          allowance is a compatibility exception for storage that ALREADY
          EXISTS, never a licence to add more. A new numeric money column fails
          even when it carries a correctly named whole-cent CHECK. (2) A change
          to a PRE-EXISTING numeric-dollar money column that leaves it without an
          active finite whole-cent CHECK constraint named
          `<table>_<column>_whole_cents_chk`, or that widens/rewrites its units.
          (3) Money arithmetic in TypeScript performed on floats, or on decimal
          strings, without first parsing the operands into integer cents. (4) Any
          write to a generated column such as invoices.balance_cents. (5) Money
          rounding done in binary floating point. Otherwise PASS.

      # STAYS error (2026-09-26). The autonomous-landing PR tried to make this a
      # warning and lean on scripts/check-migration-hard-rules.mjs, but the exact-
      # SHA Sol review (round 4, HIGH) showed that CI check reads the applied
      # boundary from .claude/schema-registry.json, which can lag a live apply —
      # so during the lag an applied migration could be edited with green CI.
      # Until a required check can prove from current ledger evidence that a
      # migration never ran, a false positive on a parked draft is the price:
      # Mason clears it with "Ignore failed checks" in the walkthrough.
      - name: Edit to an already-applied migration
        mode: warning
        instructions: >-
          Scope: only supabase/migrations/. If this pull request modifies no
          existing file there, PASS immediately.

          FAIL if the diff MODIFIES or DELETES any pre-existing file under
          supabase/migrations/. Database changes ship as brand-new migration
          files only; rewriting a migration that already ran leaves the live
          database and the repository permanently out of sync. ADDING a new file
          there is correct and is never a failure. Otherwise PASS.

# Teach CodeRabbit this repo's own written rules so it reviews against the
# actual house standard instead of only the path instructions above.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CLAUDE.md"
      - "docs/reference/gotchas.md"
      - "docs/workflows/**.md"

chat:
  auto_reply: true
